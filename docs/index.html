<head>
<meta charset="utf-8" />

<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="alternate" hreflang="ca" href="https://pgadmin3.80.cz/ca/" />
<link rel="alternate" hreflang="cs" href="https://pgadmin3.80.cz/cs/" />
<link rel="alternate" hreflang="de" href="https://pgadmin3.80.cz/de/" />
<link rel="alternate" hreflang="en" href="https://pgadmin3.80.cz/en/" />
<link rel="alternate" hreflang="es" href="https://pgadmin3.80.cz/es/" />

<link rel="alternate" hreflang="zh" href="https://pgadmin3.80.cz/zh/" />
<link rel="alternate" hreflang="x-default" href="https://pgadmin3.80.cz/" />

<meta http-equiv="refresh" content="2; url=en/index.html" />

<script>
(function () {
  var STORAGE_KEY = 'pgadmin3_lang';
  var supported = ['ca', 'cs', 'de', 'en', 'es', 'fr', 'ja', 'lv', 'pl', 'ru', 'sr', 'zh'];
  var suffix = window.location.protocol === 'file:' ? '/index.html' : '/';
  var target;

  try { target = localStorage.getItem(STORAGE_KEY); } catch (e) { /* localStorage unavailable */ }

  if (!target || supported.indexOf(target) === -1) {
    var userLangs = navigator.languages || [navigator.language || navigator.userLanguage];
    target = 'en';
    for (var i = 0; i < userLangs.length; i++) {
      if (!userLangs[i]) continue;
      var code = userLangs[i].substring(0, 2).toLowerCase();
      if (supported.indexOf(code) !== -1) { target = code; break; }
    }
    try { localStorage.setItem(STORAGE_KEY, target); } catch (e) { /* ignore */ }
  }

  window.location.href = target + suffix;
})();
</script>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  text-align: center;
  padding-top: 100px;
  color: #1a1a2e;
  background-color: #f8f9fa;
}
.loader {
  border: 4px solid #f1f5f9;
  border-top: 4px solid #2563eb;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 20px auto;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
ul { list-style-type: none; padding: 0; margin-top: 30px; }
li { display: inline-block; margin: 4px 12px; }
a { text-decoration: none; color: #2563eb; font-size: 1.05em; font-weight: 600; }
a:hover { color: #1e40af; text-decoration: underline; }
</style>
</head>
<body>
<div class="loader"></div>
<p>Redirecting to pgAdmin III&hellip;</p>
<p>If you are not redirected automatically, please choose a language:</p>
<ul id="lang-fallback-links">
  <li><a href="ca/">Català</a></li>
  <li><a href="cs/">Čeština</a></li>
  <li><a href="de/">Deutsch</a></li>
  <li><a href="en/">English</a></li>
  <li><a href="es/">Español</a></li>
  <li><a href="fr/">Français</a></li>
  <li><a href="ja/">日本語</a></li>
  <li><a href="lv/">Latviešu</a></li>
  <li><a href="pl/">Polski</a></li>
  <li><a href="ru/">Русский</a></li>
  <li><a href="sr/">Српски</a></li>
  <li><a href="zh/">中文</a></li>
</ul>
<script>
if (window.location.protocol === 'file:') {
  document.querySelectorAll('#lang-fallback-links a').forEach(function (a) {
    a.href = a.getAttribute('href') + 'index.html';
  });
}
</script>
</body>
</html>
